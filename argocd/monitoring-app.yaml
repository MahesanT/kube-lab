apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        grafana:
          adminPassword: Lab_grafana
          env:
            GF_PLUGINS_PREINSTALL_DISABLED: "true"
          livenessProbe:
            initialDelaySeconds: 300
            failureThreshold: 10
          nodeSelector:
            kubernetes.io/hostname: ansible-controller
          service:
            type: NodePort
            nodePort: 30300
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
        prometheus:
          service:
            type: NodePort
            nodePort: 30900
          prometheusSpec:
            retention: 3d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            nodeSelector:
              kubernetes.io/hostname: ansible-controller
            resources:
              requests:
                memory: 400Mi
              limits:
                memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
