apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginxweb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MahesanT/kube-lab.git
    targetRevision: main
    path: nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
